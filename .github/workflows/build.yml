name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Create and Build Project
        run: |
          mkdir -p app/src/main/java/com/kuroreader/free
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          // root project - intentionally empty
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2'
            id 'org.jetbrains.kotlin.android' version '1.9.22'
          }

          android {
            namespace 'com.kuroreader.free'
            compileSdk 34

            defaultConfig {
              applicationId "com.kuroreader.free"
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
              jvmTarget = "17"
            }
            buildTypes {
              release {
                minifyEnabled false
              }
              debug {
                minifyEnabled false
              }
            }
          }

          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application 
              android:label="KuroReader" 
              android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity 
                android:name=".MainActivity" 
                android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kuroreader/free/MainActivity.kt <<'EOF'
          package com.kuroreader.free
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              setContentView(TextView(this).apply { 
                text = "KuroReader APK Works!"
                textSize = 20f
                setPadding(50, 200, 50, 50)
              })
            }
          }
          EOF

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          wget -q https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          echo "#!/bin/sh" > gradlew
          echo 'exec java -jar $(dirname $0)/gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KuroReader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
